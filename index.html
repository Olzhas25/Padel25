<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Падел — круговой турнир</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky round switcher over a single column of court cards; standings tab ranks pairs */
:root{
  --bg:#eef3f1; --surface:#ffffff; --line:#d3dfda; --fg:#10221d; --muted:#5b6f69;
  --court:#1f6b8f; --court-ink:#ffffff; --ball:#d7e84a; --ball-ink:#1d2600;
  --win:#1b7f4e; --warn:#b26a00; --bad:#b3261e;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1715; --surface:#13221f; --line:#24392f; --fg:#e4efeb; --muted:#8fa69f;
  --court:#2b84ad; --court-ink:#ffffff; --ball:#d7e84a; --ball-ink:#1d2600;
  --win:#4fc58a; --warn:#f0a73a; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1715; --surface:#13221f; --line:#24392f; --fg:#e4efeb; --muted:#8fa69f;
  --court:#2b84ad; --court-ink:#ffffff; --ball:#d7e84a; --ball-ink:#1d2600;
  --win:#4fc58a; --warn:#f0a73a; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
header.top{background:var(--court);color:var(--court-ink);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:18px max(16px,env(safe-area-inset-left,0px)) 14px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--ball);opacity:.9;box-shadow:inset -14px -10px 0 rgba(0,0,0,.08)}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.01em;text-wrap:balance;position:relative;z-index:1}
.sub{opacity:.85;font-size:13px;margin-top:4px;position:relative;z-index:1}
.prog{margin-top:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);position:relative;z-index:1}
.prog i{display:block;height:100%;border-radius:3px;background:var(--ball);width:0;transition:width .3s}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center}
nav.tabs button .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
nav.tabs button .dot.done{background:var(--win)}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav.tabs button:focus-visible,.step:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.sec-h{font-family:var(--f-display);font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 10px}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px dashed var(--line);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;letter-spacing:.04em}
.badge.ok{background:color-mix(in srgb,var(--win) 15%,transparent);color:var(--win)}
.badge.pend{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 14px}
.row+.row{border-top:1px solid var(--line)}
.team{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.team.w::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ball);box-shadow:inset -2px -2px 0 rgba(0,0,0,.15);flex:none}
.stepper{display:flex;align-items:center;gap:4px}
.step{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:700 20px var(--f-body);cursor:pointer;touch-action:manipulation}
.step:active{transform:scale(.95)}
.val{width:40px;text-align:center;font:700 26px var(--f-num);font-variant-numeric:tabular-nums}
.val.empty{color:var(--line)}
.tb{padding:10px 14px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted)}
.tb label{display:flex;align-items:center;gap:6px}
.tb input{width:52px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:700 16px var(--f-num);text-align:center}
.msg{padding:0 14px 10px;font-size:13px;color:var(--bad)}
.msg:empty{display:none}
.foot{display:flex;justify-content:flex-end;padding:0 14px 10px}
.link{background:none;border:0;color:var(--muted);font:600 12px var(--f-body);text-decoration:underline;cursor:pointer;padding:4px}
/* standings */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.pod .p{font:700 22px var(--f-display)}
.pod .n{font-weight:700;font-size:13px;overflow-wrap:anywhere}
.pod .s{font:500 12px var(--f-num);color:var(--muted)}
.pod.first{background:var(--ball);color:var(--ball-ink);border-color:var(--ball);padding-block:18px}
.pod.first .s{color:var(--ball-ink);opacity:.75}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:center;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:700}
td{border-bottom:1px solid var(--line);font-family:var(--f-num);font-size:14px}
tr:last-child td{border-bottom:0}
td.nm{text-align:left;font-family:var(--f-body);font-weight:700;font-size:15px}
td.pl{font:700 16px var(--f-display)}
td.pts{font-weight:700;color:var(--court)}
.plus{color:var(--win)} .minus{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.matrix{margin-top:18px}
.matrix td{font-size:13px}
.matrix td.self{background:color-mix(in srgb,var(--muted) 10%,transparent)}
.matrix td.w{color:var(--win);font-weight:700}
.matrix td.l{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 12px;cursor:pointer}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.rules{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.55}
.share{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.share-h{font-weight:700}
.share p{margin:0;font-size:13px;color:var(--muted)}
.share-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.wa{background:var(--win);border-color:var(--win);color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.share textarea{width:100%;min-height:64px;font:12px var(--f-num);border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:8px;resize:vertical}
.share img{width:100%;display:block;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:160px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Падел · 6 пар</h1>
    <div class="sub" id="sub">15 матчей · сет до 5 геймов · стар-поинт</div>
    <div class="prog"><i id="progbar"></i></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
const PAIRS=["Нурбек/Ильяс","Нурлан/Алибек","Стас/Рус","Еркежан/Али","Алишер/Султан","Олжас/Виталий"];
const P=n=>PAIRS.indexOf(n);
const ROUNDS=[
 [["Нурбек/Ильяс","Олжас/Виталий"],["Еркежан/Али","Алишер/Султан"],["Нурлан/Алибек","Стас/Рус"]],
 [["Нурбек/Ильяс","Еркежан/Али"],["Нурлан/Алибек","Олжас/Виталий"],["Стас/Рус","Алишер/Султан"]],
 [["Нурбек/Ильяс","Нурлан/Алибек"],["Стас/Рус","Еркежан/Али"],["Алишер/Султан","Олжас/Виталий"]],
 [["Нурбек/Ильяс","Алишер/Султан"],["Олжас/Виталий","Стас/Рус"],["Еркежан/Али","Нурлан/Алибек"]],
 [["Нурбек/Ильяс","Стас/Рус"],["Алишер/Султан","Нурлан/Алибек"],["Олжас/Виталий","Еркежан/Али"]]
];
const MATCHES=[];ROUNDS.forEach((r,ri)=>r.forEach((m,ci)=>MATCHES.push({id:ri+"-"+ci,round:ri,court:ci+1,a:P(m[0]),b:P(m[1])})));

const KEY="padel-rr-2026-10-17-v3";
let S={scores:{},tab:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.scores)S=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sc(id){return S.scores[id]||(S.scores[id]={a:null,b:null,ta:"",tb:""})}

// result of a match: {state:'empty'|'partial'|'bad'|'done', winner:'a'|'b', msg}
function evalMatch(id){
  const s=S.scores[id];
  if(!s||(s.a===null&&s.b===null))return{state:"empty"};
  if(s.a===null||s.b===null)return{state:"partial"};
  const a=s.a,b=s.b,hi=Math.max(a,b),lo=Math.min(a,b);
  const okSet=hi===5&&lo<=4;
  if(!okSet){
    if(hi<5)return{state:"partial"};
    return{state:"bad",msg:"Такого счёта не бывает. Возможные: 5:0, 5:1, 5:2, 5:3, 5:4."};
  }
  const r={state:"done",winner:a>b?"a":"b"};
  if(hi===6&&lo===5){
    const ta=s.ta===""?null:+s.ta, tb=s.tb===""?null:+s.tb;
    if(ta!==null&&tb!==null){
      const th=Math.max(ta,tb),tl=Math.min(ta,tb);
      const okTb=(th===7&&tl<=5)||(th>7&&th-tl===2);
      if(!okTb)return{state:"bad",msg:"Тай-брейк до 7 очков с разницей в 2 (7:5, 8:6, 10:8…)."};
      if((ta>tb?"a":"b")!==r.winner)return{state:"bad",msg:"Тай-брейк выиграла не та пара, у которой 6 геймов."};
      r.tb=[ta,tb];
    }
  }
  return r;
}

function standings(){
  const T=PAIRS.map((n,i)=>({i,n,p:0,w:0,l:0,gw:0,gl:0}));
  const h2h={};
  MATCHES.forEach(m=>{
    const r=evalMatch(m.id);if(r.state!=="done")return;
    const s=S.scores[m.id],A=T[m.a],B=T[m.b];
    A.p++;B.p++;A.gw+=s.a;A.gl+=s.b;B.gw+=s.b;B.gl+=s.a;
    if(r.winner==="a"){A.w++;B.l++;h2h[m.a+">"+m.b]=1}else{B.w++;A.l++;h2h[m.b+">"+m.a]=1}
  });
  T.forEach(t=>t.gd=t.gw-t.gl);
  T.sort((x,y)=>y.w-x.w||y.gd-x.gd||y.gw-x.gw||(h2h[y.i+">"+x.i]?1:h2h[x.i+">"+y.i]?-1:0)||x.i-y.i);
  // shared places when fully tied
  T.forEach((t,k)=>{const prev=T[k-1];
    t.place=(prev&&prev.w===t.w&&prev.gd===t.gd&&prev.gw===t.gw&&!h2h[prev.i+">"+t.i]&&!h2h[t.i+">"+prev.i])?prev.place:k+1});
  return T;
}

const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function roundDone(ri){return MATCHES.filter(m=>m.round===ri).every(m=>evalMatch(m.id).state==="done")}
function renderTabs(){
  const labels=ROUNDS.map((_,i)=>`<button role="tab" id="tab${i}" aria-selected="${S.tab===i}" data-tab="${i}"><span class="dot ${roundDone(i)?"done":""}"></span>Тур ${i+1}</button>`);
  labels.push(`<button role="tab" id="tab5" aria-selected="${S.tab===5}" data-tab="5">Итоги</button>`);
  $("#tabs").innerHTML=labels.join("");
  const done=MATCHES.filter(m=>evalMatch(m.id).state==="done").length;
  $("#progbar").style.width=(done/15*100)+"%";
  $("#sub").textContent=`Сыграно ${done} из 15 · сет до 5 · стар-поинт`;
}

function badge(r){
  if(r.state==="done")return`<span class="badge ok">Завершён</span>`;
  if(r.state==="bad")return`<span class="badge bad">Проверьте счёт</span>`;
  if(r.state==="partial")return`<span class="badge pend">Идёт игра</span>`;
  return`<span class="badge pend">Не начат</span>`;
}

function cardHTML(m){
  const s=S.scores[m.id]||{a:null,b:null,ta:"",tb:""},r=evalMatch(m.id);
  const row=(side,idx)=>{const v=s[side];
    return`<div class="row"><div class="team ${r.state==="done"&&r.winner===side?"w":""}">${esc(PAIRS[idx])}</div>
    <div class="stepper"><button class="step" data-m="${m.id}" data-s="${side}" data-d="-1" aria-label="Минус гейм ${esc(PAIRS[idx])}">−</button>
    <div class="val ${v===null?"empty":""}">${v===null?"–":v}</div>
    <button class="step" data-m="${m.id}" data-s="${side}" data-d="1" aria-label="Плюс гейм ${esc(PAIRS[idx])}">+</button></div></div>`};
  const is76=s.a!==null&&s.b!==null&&Math.max(s.a,s.b)===6&&Math.min(s.a,s.b)===5;
  const tb=is76?`<div class="tb"><span>Тай-брейк (необязательно):</span>
     <label>${esc(PAIRS[m.a].split("/")[0])}… <input id="ta-${m.id}" inputmode="numeric" data-m="${m.id}" data-t="ta" value="${esc(s.ta)}"></label>
     <label>${esc(PAIRS[m.b].split("/")[0])}… <input id="tb-${m.id}" inputmode="numeric" data-m="${m.id}" data-t="tb" value="${esc(s.tb)}"></label></div>`:"";
  return`<div class="card" id="c-${m.id}"><div class="card-h"><span>Корт ${m.court}</span>${badge(r)}</div>
    ${row("a",m.a)}${row("b",m.b)}${tb}<div class="msg">${r.state==="bad"?esc(r.msg):""}</div>
    ${s.a!==null||s.b!==null?`<div class="foot"><button class="link" data-clear="${m.id}">Сбросить счёт</button></div>`:""}</div>`;
}

function renderRound(ri){
  $("#view").innerHTML=`<div class="sec-h">Тур ${ri+1} · 3 корта одновременно</div><div class="cards">${MATCHES.filter(m=>m.round===ri).map(cardHTML).join("")}</div>
  <p class="rules">Сет до 5 геймов. При 4:4 — решающий гейм, итог 5:4. В гейме при «ровно» один раз играется больше/меньше, при повторном «ровно» — стар-поинт (решающий розыгрыш).</p>`;
}

function renderStandings(){
  const T=standings(),done=MATCHES.filter(m=>evalMatch(m.id).state==="done").length;
  const sign=v=>v>0?`<span class="plus">+${v}</span>`:v<0?`<span class="minus">${v}</span>`:"0";
  const top=T.slice(0,3),order=[1,0,2];
  const pod=done?`<div class="podium">${order.map(k=>{const t=top[k];return`<div class="pod ${k===0?"first":""}"><div class="p">${t.place}</div><div class="n">${esc(t.n)}</div><div class="s">${t.w} поб · ${t.gd>0?"+":""}${t.gd}</div></div>`}).join("")}</div>`:"";
  const rows=T.map(t=>`<tr><td class="pl">${t.place}</td><td class="nm">${esc(t.n)}</td><td>${t.p}</td><td class="pts">${t.w}</td><td>${t.l}</td><td>${t.gw}–${t.gl}</td><td>${sign(t.gd)}</td></tr>`).join("");
  // head-to-head matrix
  const cell=(i,j)=>{if(i===j)return`<td class="self"></td>`;
    const m=MATCHES.find(x=>(x.a===i&&x.b===j)||(x.a===j&&x.b===i)),r=evalMatch(m.id);
    if(r.state!=="done")return`<td>·</td>`;const s=S.scores[m.id],mine=m.a===i?s.a:s.b,their=m.a===i?s.b:s.a;
    return`<td class="${mine>their?"w":"l"}">${mine}:${their}</td>`};
  const short=n=>n.split("/").map(x=>x.slice(0,3)).join("/");
  const mx=`<div class="sec-h matrix">Шахматка</div><div class="tablewrap"><table><thead><tr><th></th>${PAIRS.map(n=>`<th>${esc(short(n))}</th>`).join("")}</tr></thead><tbody>${PAIRS.map((n,i)=>`<tr><td class="nm">${esc(n)}</td>${PAIRS.map((_,j)=>cell(i,j)).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("#view").innerHTML=`<div class="sec-h">${done===15?"Финальная таблица":`Таблица · сыграно ${done} из 15`}</div>${pod}
  <div class="tablewrap"><table><thead><tr><th>#</th><th style="text-align:left">Пара</th><th>И</th><th>Поб</th><th>Пор</th><th>Геймы</th><th>±</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Места: сначала победы, потом разница геймов, потом выигранные геймы, потом личная встреча.</p>${mx}
  <div class="actions" id="actions"><button class="btn danger" id="resetAll">Сбросить весь турнир</button></div>`;
}

// ---- share via link (score encoded in #s=...) ----
function encode(){
  return MATCHES.map(m=>{const s=S.scores[m.id];if(!s||s.a===null||s.b===null)return"";
    const p=[s.a,s.b];if(s.ta!==""&&s.tb!=="")p.push(s.ta,s.tb);return p.join(".")}).join("_");
}
function shareURL(){return location.origin+location.pathname+"#s="+encode()}
function shareText(){
  const done=MATCHES.filter(m=>evalMatch(m.id).state==="done").length;
  let t=`🎾 Падел: сыграно ${done} из 15\n`;
  if(done){const T=standings();t+=T.map(x=>`${x.place}. ${x.n} — ${x.w} поб, ${x.gd>0?"+":""}${x.gd}`).join("\n")+"\n";}
  return t+`\nОткрой ссылку, счёт добавится к тебе:\n${shareURL()}`;
}
function importFromHash(){
  const m=location.hash.match(/^#s=([0-9._]*)$/);if(!m)return;
  const parts=m[1].split("_");let n=0;
  MATCHES.forEach((mt,i)=>{const p=(parts[i]||"").split(".").filter(x=>x!=="").map(Number);
    if(p.length<2||p.some(v=>!(v>=0&&v<=99)))return;
    const a=Math.min(5,p[0]),b=Math.min(5,p[1]);
    const old=S.scores[mt.id];const ta=p.length>=4?String(p[2]):"",tb=p.length>=4?String(p[3]):"";
    if(!old||old.a!==a||old.b!==b||old.ta!==ta||old.tb!==tb)n++;
    S.scores[mt.id]={a,b,ta,tb};});
  save();
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  toast(n?`Счёт обновлён: ${n} ${n===1?"матч":n<5?"матча":"матчей"}`:"Новых результатов нет");
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function shareHTML(){
  return`<div class="share" id="imgBox"><div class="share-h">Картинка с итогами</div>
  <img id="resImg" alt="Итоги: таблица и шахматка">
  <div class="share-btns"><button class="btn wa" id="imgShare">Отправить картинку</button></div>
  <p>Откроется меню «Поделиться» — выберите WhatsApp. Если не открылось: нажмите и удерживайте картинку → «Сохранить» или «Поделиться».</p></div>
  <div class="share" id="share"><div class="share-h">Ссылка со счётом</div>
  <p>Отправьте ссылку в чат. У того, кто её откроет, ваши результаты добавятся к его счёту (совпадающие матчи заменятся).</p>
  <div class="share-btns"><a class="btn wa" id="waLink" href="https://wa.me/?text=${encodeURIComponent(shareText())}" target="_blank" rel="noopener">Отправить в WhatsApp</a>
  <button class="btn main" id="copyBtn">Скопировать</button></div>
  <textarea id="shareTxt" readonly aria-label="Текст для отправки">${esc(shareText())}</textarea></div>`;
}

function render(){renderTabs();if(S.tab===5){renderStandings();$("#actions").insertAdjacentHTML("beforebegin",shareHTML());buildImage()}else renderRound(S.tab)}
let imgBlob=null,imgURL=null,imgJob=0;
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
async function buildImage(){
  const job=++imgJob;
  try{await Promise.all(["700 54px Unbounded","500 22px Unbounded","700 28px Manrope","600 28px Manrope","400 22px Manrope"].map(f=>document.fonts.load(f)))}catch(e){}
  const T=standings(),done=MATCHES.filter(m=>evalMatch(m.id).state==="done").length;
  const W=1080,P=48,rowH=74,mRow=68,headH=56,mHead=84;
  const H=200+36+56+headH+6*rowH+44+56+mHead+6*mRow+110;
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const C={bg:"#eef3f1",card:"#ffffff",line:"#d3dfda",fg:"#10221d",mut:"#5b6f69",court:"#1f6b8f",ball:"#d7e84a",win:"#1b7f4e",bad:"#b3261e",self:"#e3ebe8"};
  const FD='"Unbounded", system-ui, sans-serif',FB='"Manrope", system-ui, sans-serif';
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  g.fillStyle=C.court;g.fillRect(0,0,W,200);
  g.fillStyle=C.ball;g.beginPath();g.arc(W-30,20,140,0,Math.PI*2);g.fill();
  g.strokeStyle="rgba(255,255,255,.55)";g.lineWidth=5;g.beginPath();g.arc(W-30,20,104,Math.PI*.55,Math.PI*1.05);g.stroke();
  g.fillStyle="#fff";g.textAlign="left";g.font=`700 54px ${FD}`;g.fillText("Падел · итоги",P,102);
  g.globalAlpha=.85;g.font=`600 28px ${FB}`;g.fillText(`17 октября 2026 · ${done===15?"все 15 матчей сыграны":"сыграно "+done+" из 15"}`,P,152);g.globalAlpha=1;
  let y=236;
  const label=t=>{g.fillStyle=C.mut;g.textAlign="left";g.font=`500 22px ${FD}`;g.fillText(t,P+4,y+32);y+=56};
  // standings card
  label("ТАБЛИЦА");
  const cw=W-2*P,ch=headH+6*rowH;
  g.save();rrect(g,P,y,cw,ch,24);g.fillStyle=C.card;g.fill();g.clip();
  const cols=[["#",P+46,"center"],["ПАРА",P+100,"left"],["И",640,"center"],["ПОБ",722,"center"],["ПОР",804,"center"],["ГЕЙМЫ",900,"center"],["±",988,"center"]];
  g.font=`700 19px ${FB}`;g.fillStyle=C.mut;cols.forEach(([t,x,a])=>{g.textAlign=a;g.fillText(t,x,y+36)});
  let ry=y+headH;
  T.forEach((t,k)=>{
    if(done&&t.place===1){g.fillStyle=C.ball;g.fillRect(P,ry,cw,rowH)}
    g.fillStyle=C.line;g.fillRect(P,ry,cw,1.5);
    const mid=ry+rowH/2+10;
    g.textAlign="center";g.fillStyle=C.fg;g.font=`700 30px ${FD}`;g.fillText(String(t.place),P+46,mid+1);
    g.textAlign="left";g.font=`700 30px ${FB}`;g.fillText(t.n,P+100,mid);
    g.textAlign="center";g.font=`600 28px ${FB}`;g.fillStyle=C.fg;
    g.fillText(String(t.p),640,mid);
    g.font=`800 30px ${FB}`;g.fillStyle=(done&&t.place===1)?C.fg:C.court;g.fillText(String(t.w),722,mid);
    g.font=`600 28px ${FB}`;g.fillStyle=C.fg;g.fillText(String(t.l),804,mid);g.fillText(`${t.gw}–${t.gl}`,900,mid);
    g.font=`700 28px ${FB}`;g.fillStyle=t.gd>0?C.win:t.gd<0?C.bad:C.mut;g.fillText(t.gd>0?"+"+t.gd:String(t.gd),988,mid);
    ry+=rowH});
  g.restore();rrect(g,P,y,cw,ch,24);g.strokeStyle=C.line;g.lineWidth=2;g.stroke();
  y+=ch+44;
  // matrix card
  label("ШАХМАТКА");
  const nameW=300,cellW=(cw-nameW)/6,mh=mHead+6*mRow;
  g.save();rrect(g,P,y,cw,mh,24);g.fillStyle=C.card;g.fill();g.clip();
  PAIRS.forEach((n,j)=>{const [f,s2]=n.split("/"),x=P+nameW+cellW*j+cellW/2;
    g.textAlign="center";g.fillStyle=C.mut;g.font=`700 19px ${FB}`;g.fillText(f,x,y+38);g.fillText(s2||"",x,y+64)});
  PAIRS.forEach((n,i)=>{const yy=y+mHead+i*mRow;g.fillStyle=C.line;g.fillRect(P,yy,cw,1.5);
    g.textAlign="left";g.fillStyle=C.fg;g.font=`700 25px ${FB}`;g.fillText(n,P+24,yy+mRow/2+9);
    PAIRS.forEach((_,j)=>{const x=P+nameW+cellW*j;
      if(i===j){g.fillStyle=C.self;g.fillRect(x+1,yy+1.5,cellW-2,mRow-1.5);return}
      const m=MATCHES.find(q=>(q.a===i&&q.b===j)||(q.a===j&&q.b===i)),r=evalMatch(m.id);
      g.textAlign="center";
      if(r.state!=="done"){g.fillStyle=C.line;g.font=`700 26px ${FB}`;g.fillText("—",x+cellW/2,yy+mRow/2+9);return}
      const sc2=S.scores[m.id],mine=m.a===i?sc2.a:sc2.b,their=m.a===i?sc2.b:sc2.a,won=mine>their;
      if(won){g.fillStyle="rgba(27,127,78,.10)";g.fillRect(x+1,yy+1.5,cellW-2,mRow-1.5)}
      g.fillStyle=won?C.win:C.bad;g.font=`${won?800:600} 28px ${FB}`;g.fillText(`${mine}:${their}`,x+cellW/2,yy+mRow/2+10)})});
  g.fillStyle=C.line;g.fillRect(P+nameW,y,1.5,mh);
  g.restore();rrect(g,P,y,cw,mh,24);g.strokeStyle=C.line;g.lineWidth=2;g.stroke();
  y+=mh+46;
  g.textAlign="left";g.fillStyle=C.mut;g.font=`400 22px ${FB}`;
  g.fillText("Сет до 5 геймов, при 4:4 решающий гейм. Места: победы → разница геймов",P+4,y);
  g.fillText("→ выигранные геймы → личная встреча.",P+4,y+32);
  c.toBlob(b=>{if(job!==imgJob||!b)return;imgBlob=b;if(imgURL)URL.revokeObjectURL(imgURL);imgURL=URL.createObjectURL(b);
    const im=$("#resImg");if(im)im.src=imgURL},"image/png");
}
function refreshShare(){const w=$("#waLink"),t=$("#shareTxt");if(w)w.href="https://wa.me/?text="+encodeURIComponent(shareText());if(t)t.value=shareText()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab!==undefined){S.tab=+t.dataset.tab;save();render();window.scrollTo({top:0});return}
  if(t.dataset.m){const s=sc(t.dataset.m),side=t.dataset.s,d=+t.dataset.d;
    let v=s[side];v=v===null?(d>0?1:0):Math.min(5,Math.max(0,v+d));
    s[side]=v;const o=side==="a"?"b":"a";if(s[o]===null)s[o]=0;
    if(!(Math.max(s.a,s.b)===6&&Math.min(s.a,s.b)===5)){s.ta="";s.tb=""}
    save();renderTabs();const m=MATCHES.find(x=>x.id===t.dataset.m);
    const el=document.getElementById("c-"+m.id);el.outerHTML=cardHTML(m);
    const again=document.querySelector(`.step[data-m="${m.id}"][data-s="${side}"][data-d="${d}"]`);again&&again.focus({preventScroll:true});refreshShare();return}
  if(t.id==="imgShare"){if(!imgBlob){toast("Картинка ещё готовится");return}
    const f=new File([imgBlob],"padel-itogi.png",{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}
    toast("Нажмите и удерживайте картинку, чтобы сохранить");return}
  if(t.id==="copyBtn"){const txt=shareText(),ta=$("#shareTxt");
    const fallback=()=>{ta.focus();ta.select();toast("Текст выделен, скопируйте его")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Скопировано"),fallback)}catch(e){fallback()}return}
  if(t.dataset.clear){delete S.scores[t.dataset.clear];save();render();return}
  if(t.id==="resetAll"){$("#actions").innerHTML=`<div class="confirm">Стереть все результаты? <button class="btn danger" id="resetYes">Да, стереть</button><button class="btn" id="resetNo">Отмена</button></div>`;return}
  if(t.id==="resetYes"){S.scores={};save();render();return}
  if(t.id==="resetNo"){render();return}
});
document.addEventListener("input",e=>{
  const i=e.target;if(!i.dataset.t)return;
  i.value=i.value.replace(/\D/g,"").slice(0,2);
  sc(i.dataset.m)[i.dataset.t]=i.value;save();renderTabs();
  const card=document.getElementById("c-"+i.dataset.m),r=evalMatch(i.dataset.m);
  card.querySelector(".card-h .badge").outerHTML=badge(r);
  card.querySelector(".msg").textContent=r.state==="bad"?r.msg:"";
  refreshShare();
});
window.addEventListener("hashchange",()=>{importFromHash();render()});
importFromHash();
render();
</script>
